<svg viewBox="0 0 960 640" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>可插拔光模块结构剖面（QSFP-DD / OSFP）</title>
<desc>可插拔光模块侧视剖面：金手指插笼子，模块内 EML TOSA/ROSA + DSP + TEC，光口 LC/MPO。电通道数十 cm 级、可热插拔、可独立更换，功耗最高。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#444441">

<text x="50" y="44" font-size="17" font-weight="600" fill="#26215C">① 可插拔光模块 · 板级结构剖面（QSFP-DD / OSFP，侧视）</text>
<text x="910" y="44" text-anchor="end" font-size="12" fill="#5F5E5A">未按比例</text>

<!-- ===== 前面板 ===== -->
<rect x="856" y="78" width="16" height="300" fill="#B4B2A9" stroke="#888780" stroke-width="0.5"/>
<text x="864" y="66" text-anchor="middle" font-size="12" fill="#5F5E5A">前面板</text>

<!-- ===== 模块主体 ===== -->
<rect x="580" y="92" width="270" height="118" fill="#FFFFFF" stroke="#888780" stroke-width="1" rx="5"/>
<text x="715" y="84" text-anchor="middle" font-size="12" fill="#5F5E5A">可插拔光模块（笼内 · 热插拔）</text>
<!-- DSP -->
<rect x="594" y="122" width="52" height="62" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="620" y="147" text-anchor="middle" font-size="12" fill="#444441">DSP</text>
<text x="620" y="165" text-anchor="middle" font-size="11.5" fill="#5F5E5A">重定时</text>
<!-- TOSA -->
<rect x="668" y="122" width="50" height="62" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<rect x="679" y="132" width="26" height="17" fill="#D85A30"/>
<text x="693" y="126" text-anchor="middle" font-size="11.5" fill="#712B13">TOSA</text>
<text x="693" y="170" text-anchor="middle" font-size="11.5" fill="#5F5E5A">EML</text>
<!-- ROSA -->
<rect x="730" y="122" width="50" height="62" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<rect x="741" y="132" width="26" height="17" fill="#5E9BD7"/>
<text x="755" y="126" text-anchor="middle" font-size="11.5" fill="#0C447C">ROSA</text>
<text x="755" y="170" text-anchor="middle" font-size="11.5" fill="#5F5E5A">PD 阵列</text>
<!-- 金手指 -->
<g fill="#FAC775" stroke="#854F0B" stroke-width="0.5">
<rect x="580" y="130" width="9" height="8"/><rect x="580" y="144" width="9" height="8"/>
<rect x="580" y="158" width="9" height="8"/><rect x="580" y="172" width="9" height="8"/>
</g>
<!-- LC 光口 -->
<rect x="832" y="132" width="12" height="28" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
<line x1="780" y1="140" x2="832" y2="140" stroke="#888780" stroke-width="1.8"/>
<line x1="844" y1="140" x2="916" y2="140" stroke="#888780" stroke-width="2.2"/>
<text x="916" y="126" text-anchor="end" font-size="12" fill="#5F5E5A">LC/MPO 光口 → 外部光缆</text>

<!-- ===== 主板区 ===== -->
<rect x="90" y="240" width="560" height="164" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<text x="96" y="234" font-size="12" fill="#5F5E5A">主 PCB（交换机 / 网卡）</text>
<!-- 交换 ASIC -->
<rect x="190" y="296" width="160" height="84" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="270" y="332" text-anchor="middle" font-size="14" font-weight="600">交换 ASIC</text>
<text x="270" y="354" text-anchor="middle" font-size="12" fill="#5F5E5A">（含 SerDes）</text>
<!-- ASIC 散热鳍片 -->
<g fill="#D3D1C7" stroke="#888780" stroke-width="0.5">
<rect x="212" y="278" width="7" height="18"/><rect x="227" y="278" width="7" height="18"/>
<rect x="242" y="278" width="7" height="18"/><rect x="257" y="278" width="7" height="18"/>
<rect x="272" y="278" width="7" height="18"/><rect x="287" y="278" width="7" height="18"/>
<rect x="302" y="278" width="7" height="18"/><rect x="317" y="278" width="7" height="18"/>
</g>
<!-- 笼子 -->
<rect x="560" y="262" width="18" height="104" fill="none" stroke="#888780" stroke-width="1.6"/>
<text x="569" y="254" text-anchor="middle" font-size="12" fill="#5F5E5A">笼子</text>
<!-- 长电通道 -->
<line x1="350" y1="336" x2="560" y2="336" stroke="#BA7517" stroke-width="4"/>
<text x="455" y="322" text-anchor="middle" font-size="12" fill="#854F0B">224G 电通道 · 数十 cm 级</text>

<!-- ===== 模块内 EML+TEC 剖面 ===== -->
<rect x="90" y="92" width="440" height="118" fill="#FFFFFF" stroke="#888780" stroke-width="0.5" rx="5"/>
<text x="96" y="84" font-size="12" fill="#5F5E5A">模块内部 · 光发射子组件（EML + TEC 蝶形封装）</text>
<!-- TEC -->
<rect x="110" y="162" width="150" height="22" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="185" y="178" text-anchor="middle" font-size="12" fill="#0C447C">热电制冷器 TEC（±0.01℃）</text>
<!-- AlN 基板 -->
<rect x="126" y="146" width="118" height="16" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="185" y="140" text-anchor="middle" font-size="11.5" fill="#5F5E5A">AlN 基板</text>
<!-- EML 芯片 -->
<rect x="150" y="118" width="38" height="28" fill="#D85A30"/>
<rect x="188" y="118" width="18" height="28" fill="#F0997B"/>
<text x="180" y="112" text-anchor="middle" font-size="11.5" fill="#712B13">EML（DFB+EA）</text>
<!-- 隔离器 -->
<rect x="286" y="122" width="18" height="15" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="295" y="116" text-anchor="middle" font-size="11.5" fill="#0F6E56">隔离器</text>
<!-- 透镜 -->
<ellipse cx="332" cy="130" rx="9" ry="15" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="332" y="102" text-anchor="middle" font-size="11.5" fill="#185FA5">透镜</text>
<line x1="304" y1="130" x2="470" y2="130" stroke="#E24B4A" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrowR)"/>
<rect x="474" y="120" width="16" height="20" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
<text x="482" y="110" text-anchor="middle" font-size="11.5" fill="#5F5E5A">套管·尾纤</text>
<!-- Driver/TIA -->
<rect x="336" y="162" width="72" height="22" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="372" y="178" text-anchor="middle" font-size="12" fill="#633806">Driver / TIA</text>
<line x1="410" y1="184" x2="670" y2="130" stroke="#888780" stroke-width="0.5" stroke-dasharray="2 2"/>
<line x1="300" y1="188" x2="330" y2="184" stroke="#888780" stroke-width="0.5" stroke-dasharray="2 2"/>

<!-- ===== 面积/功耗权衡注释 ===== -->
<rect x="690" y="240" width="212" height="164" fill="#F7F7F5" stroke="#D3D1C7" stroke-width="0.5" rx="5"/>
<text x="796" y="266" font-size="13" font-weight="600" fill="#444441">面板密度瓶颈</text>
<line x1="704" y1="274" x2="888" y2="274" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="702" y="296" font-size="11.5" fill="#5F5E5A">单端口功耗 ~12-18W（含 DSP），</text>
<text x="702" y="316" font-size="11.5" fill="#5F5E5A">224G 代际逼近风冷极限；</text>
<text x="702" y="336" font-size="11.5" fill="#5F5E5A">光口占面板面积大，1U 64 端口</text>
<text x="702" y="356" font-size="11.5" fill="#5F5E5A">已是上限——密度与功耗共同</text>
<text x="702" y="376" font-size="11.5" fill="#5F5E5A">推动光引擎向芯片侧迁移</text>
<text x="702" y="396" font-size="11.5" fill="#712B13">（→ NPO / CPO）</text>

<!-- ===== 底部演进条 ===== -->
<rect x="90" y="436" width="756" height="48" fill="#FFFFFF" stroke="#888780" stroke-width="0.5" rx="5"/>
<text x="112" y="458" font-size="12.5" fill="#444441" font-weight="600">可插拔</text>
<text x="112" y="475" font-size="11.5" fill="#5F5E5A">电通道长·DSP 补偿</text>
<line x1="220" y1="460" x2="420" y2="460" stroke="#0F6E56" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320" y="450" text-anchor="middle" font-size="11.5" fill="#0F6E56">电通道缩短、去 DSP</text>
<rect x="424" y="444" width="170" height="34" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5" rx="4"/>
<text x="509" y="465" text-anchor="middle" font-size="12.5" fill="#085041">NPO 近封装</text>
<line x1="594" y1="460" x2="664" y2="460" stroke="#0F6E56" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="668" y="444" width="170" height="34" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" rx="4"/>
<text x="753" y="465" text-anchor="middle" font-size="12.5" fill="#085041">CPO 共封装</text>

<!-- ===== 注释区 ===== -->
<text x="50" y="516" font-size="12.5" fill="#5F5E5A">模块自含 DSP（约占总功耗 1/3-1/2），因电通道长、信号完整性需重定时；可热插拔、故障即换，运维模型最简单</text>
<text x="50" y="542" font-size="12.5" fill="#5F5E5A">光源封装在模块内（EML+TEC 蝶形），与 NPO/CPO 外置 ELSFP 供光的架构根本不同——维修性最好，功耗与密度最差</text>
<text x="50" y="578" font-size="12.5" fill="#5F5E5A">口径说明：结构为 QSFP-DD800/OSFP 类 800G-1.6T 模块通用抽象；电通道长度、功耗区间为行业公开资料整理</text>
<text x="50" y="604" font-size="12.5" fill="#5F5E5A">图例：红虚线=模块内光路 · 灰实线=数据光纤 · 橙粗线=224G 电通道 · 黄块=金手指/射频 · 蓝=TEC/热管理</text>
</g>
</svg>
