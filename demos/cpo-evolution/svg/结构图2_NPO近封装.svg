<svg viewBox="0 0 960 700" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>NPO 板级近封装光学结构剖面</title>
<desc>NPO 侧视板级剖面：交换 ASIC 居中，NPO 光引擎（EIC+硅光 PIC+高通道 FAU）近封装于 ASIC 两侧，224G 超短电通道互联；ELSFP 外置光源经保偏光纤向 OE 供 CW 连续光，数据经板内光纤至面板 MPO 连接器出外部光缆。OE 可独立测试与更换，是 CPO 之前的工程化过渡架构。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#444441">

<text x="50" y="44" font-size="17" font-weight="600" fill="#26215C">② NPO · 板级近封装光学结构剖面（侧视）</text>
<text x="910" y="44" text-anchor="end" font-size="12" fill="#5F5E5A">未按比例</text>

<!-- ===== 前面板 ===== -->
<rect x="856" y="78" width="16" height="400" fill="#B4B2A9" stroke="#888780" stroke-width="0.5"/>
<text x="864" y="66" text-anchor="middle" font-size="12" fill="#5F5E5A">前面板</text>

<!-- ===== ELSFP 外置光源 ===== -->
<rect x="640" y="92" width="140" height="86" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="710" y="114" text-anchor="middle" font-size="12.5" fill="#085041">ELSFP 外置光源</text>
<g>
<rect x="654" y="128" width="16" height="18" fill="#D85A30"/>
<rect x="676" y="128" width="16" height="18" fill="#D85A30"/>
<rect x="698" y="128" width="16" height="18" fill="#D85A30"/>
<rect x="720" y="128" width="16" height="18" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
</g>
<text x="710" y="166" text-anchor="middle" font-size="12" fill="#0F6E56">CW 阵列×4（含冗余）</text>

<!-- 保偏供光 -->
<line x1="640" y1="136" x2="300" y2="136" stroke="#E24B4A" stroke-width="1.2" stroke-dasharray="5 3"/>
<line x1="710" y1="178" x2="710" y2="370" stroke="#E24B4A" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<line x1="300" y1="136" x2="300" y2="370" stroke="#E24B4A" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="470" y="126" text-anchor="middle" font-size="12" fill="#712B13">保偏光纤供光（CW 连续光，慢轴对准）</text>

<!-- 板内数据光纤 -->
<line x1="272" y1="382" x2="272" y2="252" stroke="#888780" stroke-width="1.4"/>
<line x1="272" y1="252" x2="850" y2="252" stroke="#888780" stroke-width="1.4"/>
<line x1="710" y1="382" x2="710" y2="296" stroke="#888780" stroke-width="1.4"/>
<line x1="710" y1="296" x2="850" y2="296" stroke="#888780" stroke-width="1.4"/>
<text x="430" y="242" text-anchor="middle" font-size="12" fill="#5F5E5A">板内光纤（多芯单模）</text>

<!-- 面板 MPO -->
<rect x="850" y="244" width="12" height="17" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
<rect x="850" y="288" width="12" height="17" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
<line x1="862" y1="252" x2="930" y2="252" stroke="#888780" stroke-width="2.2"/>
<line x1="862" y1="296" x2="930" y2="296" stroke="#888780" stroke-width="2.2"/>
<text x="930" y="236" text-anchor="end" font-size="12" fill="#5F5E5A">面板 MPO → 外部光缆</text>

<!-- ASIC 散热器 -->
<g fill="#D3D1C7" stroke="#888780" stroke-width="0.5">
<rect x="452" y="318" width="7" height="56"/><rect x="467" y="318" width="7" height="56"/>
<rect x="482" y="318" width="7" height="56"/><rect x="497" y="318" width="7" height="56"/>
<rect x="512" y="318" width="7" height="56"/><rect x="527" y="318" width="7" height="56"/>
</g>
<text x="498" y="308" text-anchor="middle" font-size="12" fill="#5F5E5A">散热器</text>

<!-- 交换 ASIC -->
<rect x="436" y="374" width="124" height="78" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="498" y="406" text-anchor="middle" font-size="14" font-weight="600">交换 ASIC</text>
<text x="498" y="428" text-anchor="middle" font-size="12" fill="#5F5E5A">（51.2T 级）</text>

<!-- 224G 短电通道 -->
<line x1="384" y1="412" x2="436" y2="412" stroke="#BA7517" stroke-width="4"/>
<line x1="560" y1="412" x2="612" y2="412" stroke="#BA7517" stroke-width="4"/>
<text x="386" y="398" text-anchor="middle" font-size="12" fill="#854F0B">224G &lt;50mm</text>
<text x="610" y="398" text-anchor="middle" font-size="12" fill="#854F0B">224G &lt;50mm</text>

<!-- 左 OE -->
<g>
<rect x="244" y="374" width="140" height="78" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<rect x="260" y="352" width="104" height="22" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="280" y="396" width="68" height="22" fill="#B4B2A9"/>
<rect x="256" y="422" width="116" height="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
</g>
<!-- 右 OE -->
<g>
<rect x="612" y="374" width="140" height="78" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<rect x="628" y="352" width="104" height="22" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="648" y="396" width="68" height="22" fill="#B4B2A9"/>
<rect x="624" y="422" width="116" height="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
</g>

<text x="232" y="360" text-anchor="end" font-size="12" fill="#444441">NPO 光引擎 OE</text>
<text x="232" y="378" text-anchor="end" font-size="12" fill="#5F5E5A">（可测·可换）</text>
<text x="232" y="400" text-anchor="end" font-size="12" fill="#5F5E5A">EIC 驱动/TIA</text>
<text x="232" y="424" text-anchor="end" font-size="12" fill="#5F5E5A">BGA 焊接</text>
<text x="232" y="442" text-anchor="end" font-size="12" fill="#5F5E5A">料站可返修</text>

<line x1="272" y1="492" x2="272" y2="452" stroke="#888780" stroke-width="0.5" stroke-dasharray="2 2"/>
<text x="272" y="516" text-anchor="middle" font-size="12" fill="#0F6E56">硅光 PIC（调制/PD）</text>
<line x1="710" y1="492" x2="710" y2="452" stroke="#888780" stroke-width="0.5" stroke-dasharray="2 2"/>
<text x="710" y="516" text-anchor="middle" font-size="12" fill="#0F6E56">硅光 PIC（调制/PD）</text>

<!-- ===== 主 PCB ===== -->
<rect x="90" y="452" width="700" height="20" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="782" y="466" font-size="12" fill="#5F5E5A">主 PCB</text>

<!-- ===== 底部演进条 ===== -->
<rect x="90" y="546" width="756" height="48" fill="#FFFFFF" stroke="#888780" stroke-width="0.5" rx="5"/>
<rect x="102" y="554" width="150" height="34" fill="#F1EFE8" stroke="#888780" stroke-width="0.5" rx="4"/>
<text x="177" y="576" text-anchor="middle" font-size="12.5" fill="#444441">可插拔</text>
<line x1="252" y1="571" x2="322" y2="571" stroke="#0F6E56" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="326" y="554" width="190" height="34" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.6" rx="4"/>
<text x="421" y="576" text-anchor="middle" font-size="12.5" fill="#085041" font-weight="600">NPO 近封装 ← 本图</text>
<line x1="516" y1="571" x2="586" y2="571" stroke="#0F6E56" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="590" y="554" width="190" height="34" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" rx="4"/>
<text x="685" y="576" text-anchor="middle" font-size="12.5" fill="#085041">CPO 共封装</text>

<!-- ===== 注释区 ===== -->
<text x="50" y="628" font-size="12.5" fill="#5F5E5A">NPO：光引擎独立封装、贴装于 ASIC 旁，224G 电通道 &lt;50mm；保留部件筛选、良率隔离与维修弹性（可独立测试/更换）</text>
<text x="50" y="652" font-size="12.5" fill="#5F5E5A">光源外置 ELSFP（激光器 MTBF 远低于 ASIC，外置可热换 + 冗余备份，规避最高失效率单点）</text>
<text x="50" y="676" font-size="12.5" fill="#5F5E5A">图例：红虚线=供光光路 · 灰实线=数据光纤 · 橙粗线=224G 电通道 · 绿色块=光引擎/PIC/供光模组　依据：中泰《光学向芯片靠近》+ OFC 2024-25 整理</text>
</g>
</svg>
