<svg viewBox="0 0 960 760" width="100%" xmlns="http://www.w3.org/2000/svg">
<title>CPO 共封装光学结构剖面</title>
<desc>CPO 侧视剖面：交换 ASIC 与光引擎（OE）共封装于同一封装体内，224G 电通道小于 10mm；ELSFP 外置光源经保偏光纤向 OE 供 CW 光；数据经封装边缘光纤引出至面板；集成冷板液冷。与 NPO 的核心差异：OE 不可独立更换，需 Known Good Die，良率乘法复合。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#444441">

<text x="50" y="44" font-size="17" font-weight="600" fill="#26215C">③ CPO · 共封装光学结构剖面（与②同视角对比）</text>
<text x="910" y="44" text-anchor="end" font-size="12" fill="#5F5E5A">未按比例</text>

<!-- ===== 前面板 ===== -->
<rect x="856" y="78" width="16" height="410" fill="#B4B2A9" stroke="#888780" stroke-width="0.5"/>
<text x="864" y="66" text-anchor="middle" font-size="12" fill="#5F5E5A">前面板</text>

<!-- ===== ELSFP 外置光源 ===== -->
<rect x="640" y="92" width="140" height="86" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="710" y="114" text-anchor="middle" font-size="12.5" fill="#085041">ELSFP 外置光源</text>
<g>
<rect x="654" y="128" width="16" height="18" fill="#D85A30"/>
<rect x="676" y="128" width="16" height="18" fill="#D85A30"/>
<rect x="698" y="128" width="16" height="18" fill="#D85A30"/>
<rect x="720" y="128" width="16" height="18" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
</g>
<text x="710" y="166" text-anchor="middle" font-size="12" fill="#0F6E56">CW 阵列×4（含冗余）</text>

<!-- 保偏供光 -->
<line x1="640" y1="136" x2="300" y2="136" stroke="#E24B4A" stroke-width="1.2" stroke-dasharray="5 3"/>
<line x1="710" y1="178" x2="710" y2="318" stroke="#E24B4A" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<line x1="300" y1="136" x2="300" y2="318" stroke="#E24B4A" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="470" y="126" text-anchor="middle" font-size="12" fill="#712B13">保偏光纤供光（CW 连续光）</text>

<!-- ===== 冷板 ===== -->
<rect x="210" y="288" width="540" height="16" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<rect x="252" y="276" width="22" height="12" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="636" y="276" width="22" height="12" fill="#85B7EB" stroke="#185FA5" stroke-width="0.5"/>
<text x="263" y="268" text-anchor="middle" font-size="12" fill="#185FA5">冷却液进</text>
<text x="647" y="268" text-anchor="middle" font-size="12" fill="#185FA5">冷却液出</text>
<text x="480" y="326" text-anchor="middle" font-size="12" fill="#185FA5">集成冷板（ASIC 热流密度 &gt;1000W 需液冷）</text>

<!-- ===== 封装体 ===== -->
<rect x="210" y="304" width="540" height="130" fill="#FFFFFF" stroke="#888780" stroke-width="1"/>
<text x="216" y="298" font-size="12" fill="#5F5E5A">共封装体（Package）</text>

<!-- 交换 ASIC -->
<rect x="400" y="340" width="160" height="80" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="480" y="374" text-anchor="middle" font-size="14" font-weight="600">交换 ASIC</text>
<text x="480" y="396" text-anchor="middle" font-size="12" fill="#5F5E5A">（102.4T 级）</text>

<!-- OE 阵列（左×2） -->
<g>
<rect x="232" y="336" width="64" height="50" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<rect x="232" y="336" width="64" height="21" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<rect x="232" y="357" width="64" height="29" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="222" y="336" width="10" height="50" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="312" y="336" width="64" height="50" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<rect x="312" y="336" width="64" height="21" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<rect x="312" y="357" width="64" height="29" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="376" y="336" width="10" height="50" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
</g>
<!-- OE 阵列（右×2） -->
<g>
<rect x="584" y="336" width="64" height="50" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<rect x="584" y="336" width="64" height="21" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<rect x="584" y="357" width="64" height="29" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="574" y="336" width="10" height="50" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="664" y="336" width="64" height="50" fill="#FFFFFF" stroke="#888780" stroke-width="0.5"/>
<rect x="664" y="336" width="64" height="21" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<rect x="664" y="357" width="64" height="29" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="728" y="336" width="10" height="50" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
</g>

<!-- 224G 超短电通道 -->
<line x1="386" y1="360" x2="400" y2="360" stroke="#BA7517" stroke-width="4"/>
<line x1="560" y1="360" x2="574" y2="360" stroke="#BA7517" stroke-width="4"/>
<text x="384" y="330" text-anchor="middle" font-size="12" fill="#854F0B">224G &lt;10mm</text>
<text x="578" y="330" text-anchor="middle" font-size="12" fill="#854F0B">224G</text>

<!-- 封装边缘光纤 -->
<path d="M222,362 L140,362" fill="none" stroke="#888780" stroke-width="1.4"/>
<path d="M140,362 L140,252 L850,252" fill="none" stroke="#888780" stroke-width="1.4"/>
<path d="M738,362 L780,362 L780,300" fill="none" stroke="#888780" stroke-width="1.4"/>
<path d="M780,300 L850,300" fill="none" stroke="#888780" stroke-width="1.4"/>
<text x="490" y="242" text-anchor="middle" font-size="12" fill="#5F5E5A">封装边缘光纤引出（Fiber Attach）→ 沿板边至面板</text>

<!-- 面板 MPO -->
<rect x="850" y="244" width="12" height="17" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
<rect x="850" y="292" width="12" height="17" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
<line x1="862" y1="252" x2="930" y2="252" stroke="#888780" stroke-width="2.2"/>
<line x1="862" y1="300" x2="930" y2="300" stroke="#888780" stroke-width="2.2"/>
<text x="930" y="236" text-anchor="end" font-size="12" fill="#5F5E5A">面板 MPO → 外部光缆</text>

<!-- 封装基板 -->
<rect x="210" y="434" width="540" height="20" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="754" y="448" font-size="12" fill="#5F5E5A">封装基板</text>
<g fill="#B4B2A9" stroke="#888780" stroke-width="0.5">
<circle cx="252" cy="468" r="4.5"/><circle cx="308" cy="468" r="4.5"/><circle cx="364" cy="468" r="4.5"/><circle cx="420" cy="468" r="4.5"/>
<circle cx="480" cy="468" r="4.5"/><circle cx="536" cy="468" r="4.5"/><circle cx="592" cy="468" r="4.5"/><circle cx="648" cy="468" r="4.5"/><circle cx="704" cy="468" r="4.5"/>
</g>
<!-- 主 PCB -->
<rect x="100" y="482" width="710" height="18" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
<text x="812" y="495" font-size="12" fill="#5F5E5A">主 PCB</text>

<text x="264" y="522" text-anchor="middle" font-size="12" fill="#633806">OE：EIC 驱动/TIA</text>
<text x="344" y="522" text-anchor="middle" font-size="12" fill="#185FA5">硅光 PIC 调制/PD</text>
<text x="616" y="522" text-anchor="middle" font-size="12" fill="#0F6E56">边缘耦合/DFAU</text>
<text x="696" y="522" text-anchor="middle" font-size="12" fill="#633806">OE ×2/侧</text>

<!-- ===== 底部演进条 ===== -->
<rect x="90" y="546" width="756" height="48" fill="#FFFFFF" stroke="#888780" stroke-width="0.5" rx="5"/>
<rect x="102" y="554" width="150" height="34" fill="#F1EFE8" stroke="#888780" stroke-width="0.5" rx="4"/>
<text x="177" y="576" text-anchor="middle" font-size="12.5" fill="#444441">可插拔</text>
<line x1="252" y1="571" x2="322" y2="571" stroke="#0F6E56" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="326" y="554" width="190" height="34" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" rx="4"/>
<text x="421" y="576" text-anchor="middle" font-size="12.5" fill="#085041">NPO 近封装</text>
<line x1="516" y1="571" x2="586" y2="571" stroke="#0F6E56" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="590" y="554" width="190" height="34" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1.6" rx="4"/>
<text x="685" y="576" text-anchor="middle" font-size="12.5" fill="#085041" font-weight="600">CPO 共封装 ← 本图</text>

<!-- ===== 注释区 ===== -->
<text x="50" y="628" font-size="12.5" fill="#712B13">失效模式分层：①光源（ELSFP）——两种架构均外置可插拔、可热换，无维修性差异（激光器 MTBF 远低于 ASIC，冗余已覆盖）；</text>
<text x="50" y="652" font-size="12.5" fill="#712B13">②PIC/EIC/OE 芯片与互连——CPO 封装后不可独立更换（维修=换整个封装体），NPO 可换单颗 OE；这是真实差异所在；</text>
<text x="50" y="676" font-size="12.5" fill="#712B13">③良率与通道数：CPO 需 KGD 全检，良率乘法复合 + 数百上千通道耦合——牺牲维修性换取最低功耗与最高密度</text>
<text x="50" y="712" font-size="12.5" fill="#5F5E5A">图例：红虚线=CW 供光 · 灰实线=数据光纤 · 橙粗线=224G 电通道 · 绿色块=OE/PIC/光源环节　依据：中泰《光学向芯片靠近》+ NV 官宣新闻稿 + OFC 2024-25 整理</text>
</g>
</svg>
